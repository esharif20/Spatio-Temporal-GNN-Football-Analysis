name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics==8.3.223 supervision==0.18.0
          pip install pytest pytest-mock numpy opencv-python-headless pandas scikit-learn

      - name: Run tests
        run: |
          cd src && pip install -e . || true
          export PYTHONPATH="${PYTHONPATH}:$(pwd)/src"
          python -m pytest tests/ -v --tb=short
